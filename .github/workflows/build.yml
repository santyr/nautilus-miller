name: Build and native regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 44 / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: registry.fedoraproject.org/fedora:44
      # Existing bubblewrap/Home and nested-compositor tests need namespaces.
      # This runs only on the disposable GitHub-hosted VM, with no secrets.
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            profile: ''
            prefix: /usr
          - name: miller
            profile: Miller
            prefix: /home/miller/.local/opt/nautilus-miller
    env:
      LANG: C.UTF-8
      XDG_SESSION_TYPE: wayland
      GSK_RENDERER: cairo
      PROFILE: ${{ matrix.profile }}
      PREFIX: ${{ matrix.prefix }}
    steps:
      - name: Install checkout and existing harness dependencies
        run: dnf -y install dnf5-plugins rpm-build git tar python3-gobject bubblewrap dbus-daemon mutter glibc-langpack-en mesa-dri-drivers xdg-desktop-portal-gnome gvfs-archive glycin-thumbnailer gst-thumbnailers xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native Fedora build dependencies
        run: dnf -y builddep packaging/fedora/nautilus-miller.spec
      - name: Start the container platform bus
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - name: Prepare a nonroot canonical Home
        run: |
          useradd --create-home --shell /bin/bash miller
          mkdir /home/miller/nautilus
          cp -a . /home/miller/nautilus/
          chown -R miller:miller /home/miller/nautilus
      - name: Build
        run: |
          runuser -u miller -- env PROFILE="$PROFILE" PREFIX="$PREFIX" bash -ec '
            cd /home/miller/nautilus
            meson setup build-ci --prefix="$PREFIX" -Dprofile="$PROFILE" -Dtests=all -Ddocs=false
            meson compile -C build-ci
          '
      - name: Check development identity
        if: matrix.profile == 'Miller'
        run: runuser -u miller -- bash -ec 'cd /home/miller/nautilus; python3 tools/miller/check-profile.py build-ci'
      - name: Permit native test namespaces on the disposable hosted VM
        # Ubuntu's host AppArmor userns restriction also applies to the Fedora
        # container. Keep bwrap/Home isolation; change only this ephemeral VM.
        # https://documentation.ubuntu.com/release-notes/24.04/
        if: runner.environment == 'github-hosted'
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$restriction" ]; then
            cat "$restriction"
            echo 0 > "$restriction"
          fi
          runuser -u miller -- bwrap --unshare-user --ro-bind / / --proc /proc -- /usr/bin/true
      - name: Run existing tests in guarded disposable sessions and Home
        run: |
          runuser -u miller -- bash -ec '
            cd /home/miller/nautilus
            MILLER_SUITE_BUILD=build-ci python3 tools/miller/with-test-session.py -- meson test -C build-ci --no-rebuild --num-processes 2 --wrapper "python3 $PWD/tools/miller/ci-test-wrapper.py" --print-errorlogs
            python3 test/miller/test-deployment.py
          '
      - name: Upload native test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-${{ matrix.name }}-logs
          path: /home/miller/nautilus/build-ci/meson-logs/
          if-no-files-found: warn
